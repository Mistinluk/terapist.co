services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: yalnizca-yerel-test
      POSTGRES_DB: terapist_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tester -d terapist_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
