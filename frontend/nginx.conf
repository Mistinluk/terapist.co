# TLS, üretimde güvenilir giriş katmanında sonlandırılmalıdır.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    access_log off;
    # Railway dağıtımlarında API IP'si değişebilir; DNS yeniden çözülür.
    resolver ${DNS_RESOLVER} valid=10s;
    set $api_upstream http://${API_UPSTREAM};

    location = /healthz {
        return 200 "ok\n";
    }

    set $response_cache_control "no-store";
    set $response_robots "";
    set $response_referrer "strict-origin";
    # SPA'nın /index.html iç yönlendirmesinde özgün istek yolu korunur.
    if ($request_uri ~ "^/randevularim(/|[?]|$)") {
        set $response_robots "noindex, nofollow";
        set $response_referrer "no-referrer";
    }
    if ($uri ~ "^/(badge/[^/]+\.svg$|robots\.txt$|sitemap\.xml$|llms\.txt$)") {
        set $response_cache_control "public, max-age=300";
    }
    if ($uri ~ "^/badge/[^/]+\.svg$") {
        set $response_cache_control "public, max-age=60, must-revalidate";
    }

    add_header Cache-Control $response_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy $response_referrer always;
    add_header X-Robots-Tag $response_robots always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://open.spotify.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 12 MiB görsel + multipart başlıkları. Diğer API istekleri 32 KiB kalır.
    location = /api/medya/profil-fotografi {
        client_max_body_size 13m;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # İstemciden gelen X-Forwarded-For'a güvenilmez.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location /passport/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location /uzman/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location /badge/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location = /robots.txt {
        proxy_pass $api_upstream/robots.txt;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
    }
    location = /sitemap.xml {
        proxy_pass $api_upstream/sitemap.xml;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
    }
    # Tek parçalı, ayrılmış uygulama yolları dışındaki profil adları API'de HTML üretilir.
    location ~ "^/(?!api$|assets$|aydinlatma$|badge$|basvuru$|cozumler$|davet$|favicon$|giris$|karsilastirma$|kesfet$|ozellikler$|panel$|randevularim$|passport$|passport-assets$|r$|rehber$|uzman$|yonetim$|admin$)[a-z][a-z0-9-]{1,38}[a-z0-9]$" {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
