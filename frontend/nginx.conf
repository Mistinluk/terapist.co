# TLS, üretimde güvenilir giriş katmanında sonlandırılmalıdır.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    access_log off;

    set $response_cache_control "no-store";
    if ($uri ~ "^/(badge/[^/]+\.svg$|robots\.txt$|sitemap\.xml$|llms\.txt$)") {
        set $response_cache_control "public, max-age=300";
    }
    if ($uri ~ "^/badge/[^/]+\.svg$") {
        set $response_cache_control "public, max-age=60, must-revalidate";
    }

    add_header Cache-Control $response_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://open.spotify.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # İstemciden gelen X-Forwarded-For'a güvenilmez.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location /passport/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location /uzman/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location /badge/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location = /robots.txt {
        proxy_pass http://api:8000/robots.txt;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
    }
    location = /sitemap.xml {
        proxy_pass http://api:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
    }
    # Tek parçalı, ayrılmış uygulama yolları dışındaki profil adları API'de HTML üretilir.
    location ~ ^/(?!api$|assets$|aydinlatma$|badge$|basvuru$|cozumler$|davet$|favicon$|giris$|karsilastirma$|kesfet$|panel$|passport$|passport-assets$|r$|rehber$|uzman$|yonetim$|admin$)[a-z][a-z0-9-]{1,38}[a-z0-9]$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
