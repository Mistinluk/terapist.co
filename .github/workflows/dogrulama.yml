name: Kod ve güvenlik doğrulaması
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: yalnizca-yerel-test
          POSTGRES_DB: terapist_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U tester -d terapist_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.13
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://tester:yalnizca-yerel-test@127.0.0.1:55439/terapist_test
          TEST_REDIS_URL: redis://127.0.0.1:56379/0
      - run: uv run pip-audit --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit --prod
